name: Checks

on:
    pull_request:
    merge_group:
    push:
        branches:
            - dev
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    format-and-lint:
        name: Format & lint (ruff)
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Check formatting
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  args: "format --check --diff"
                  src: "src tests"

            - name: Lint
              uses: astral-sh/ruff-action@v4.1.0
              with:
                  args: "check --output-format=github"
                  src: "src tests"

    typecheck:
        name: Type check (ty)
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            # Ty only needs the python module sources.
            # It never loads or runs any of the modules
            # which prevent the necessity to install 
            # micromamba dependencies.
            - name: Install dev dependencies
              run: pip install -e '.[dev]'

            - name: Type check
              run: ty check --output-format github
